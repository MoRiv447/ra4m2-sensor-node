<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrSlate" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748B"/>
    </marker>
    <marker id="arrTeal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="980" height="600" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="22" font-weight="bold" fill="#0F172A">RA4M2 环境监测节点 · 系统框图</text>
  <text x="40" y="70" font-size="13" fill="#64748B">同一份采集数据 · 三种访问方式</text>

  <!-- ================= 感知层 ================= -->
  <rect x="32" y="100" width="195" height="444" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="48" y="130" font-size="13.5" font-weight="bold" fill="#115E59">感知层 · 面包板传感器</text>

  <rect x="46" y="150" width="167" height="64" rx="10" fill="#FFFFFF" stroke="#CCFBF1"/>
  <text x="58" y="177" font-size="13" font-weight="bold" fill="#0F766E">BH1750 · 光照</text>
  <text x="58" y="197" font-size="10.5" fill="#64748B">I2C（软件总线）</text>

  <rect x="46" y="230" width="167" height="64" rx="10" fill="#FFFFFF" stroke="#CCFBF1"/>
  <text x="58" y="257" font-size="13" font-weight="bold" fill="#0F766E">BMP280 · 气压</text>
  <text x="58" y="277" font-size="10.5" fill="#64748B">I2C（软件总线）</text>

  <rect x="46" y="310" width="167" height="64" rx="10" fill="#FFFFFF" stroke="#CCFBF1"/>
  <text x="58" y="337" font-size="13" font-weight="bold" fill="#0F766E">DHT22 · 温湿度</text>
  <text x="58" y="357" font-size="10.5" fill="#64748B">单总线</text>

  <rect x="46" y="390" width="167" height="64" rx="10" fill="#FFFFFF" stroke="#CCFBF1"/>
  <text x="58" y="417" font-size="13" font-weight="bold" fill="#0F766E">分压基准 + LDR</text>
  <text x="58" y="437" font-size="10.5" fill="#64748B">ADC 模拟通道</text>

  <text x="48" y="520" font-size="10.5" fill="#94A3B8">2 × I2C ＋ 1 × 单总线 ＋ 1 × ADC</text>

  <!-- ================= 开发板 ================= -->
  <rect x="296" y="100" width="310" height="444" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="312" y="130" font-size="13.5" font-weight="bold" fill="#1E3A8A">RA4M2-SENSOR 开发板</text>

  <rect x="352" y="160" width="198" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="451" y="200" font-size="21" font-weight="bold" fill="#1D4ED8" text-anchor="middle">RA4M2</text>
  <text x="451" y="224" font-size="12" fill="#475569" text-anchor="middle">Cortex-M33 @ 48MHz</text>
  <text x="451" y="246" font-size="11" fill="#64748B" text-anchor="middle">低功耗四平台可切换</text>

  <rect x="314" y="306" width="138" height="70" rx="10" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="326" y="336" font-size="12" font-weight="bold" fill="#1E40AF">CH340C</text>
  <text x="326" y="356" font-size="10.5" fill="#64748B">调试串口 SCI9</text>

  <rect x="462" y="306" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="474" y="336" font-size="12" font-weight="bold" fill="#1E40AF">LDO ×2 · 指示灯</text>
  <text x="474" y="356" font-size="10.5" fill="#64748B">3V3 域常驻负载</text>

  <text x="451" y="520" font-size="10.5" fill="#64748B" text-anchor="middle">供电：Type-C / VIN 5V</text>

  <!-- ================= 链路层 ================= -->
  <rect x="644" y="100" width="304" height="118" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="666" cy="138" r="5" fill="#64748B"/>
  <text x="682" y="143" font-size="14" font-weight="bold" fill="#0F172A">本地 · 串口终端</text>
  <text x="666" y="170" font-size="11.5" fill="#475569">SCI9 → CH340 → 串口助手</text>
  <rect x="666" y="184" width="118" height="24" rx="12" fill="#F1F5F9"/>
  <text x="725" y="200" font-size="11" fill="#475569" text-anchor="middle">每 10s 一帧</text>

  <rect x="644" y="248" width="304" height="132" rx="14" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5"/>
  <circle cx="666" cy="286" r="5" fill="#14B8A6"/>
  <text x="682" y="291" font-size="14" font-weight="bold" fill="#0F172A">近场 · 蓝牙（DA14531）</text>
  <text x="666" y="318" font-size="11.5" fill="#475569">SCI0 · BLE 透传 → 手机 / 网页</text>
  <rect x="666" y="344" width="150" height="24" rx="12" fill="#F0FDFA"/>
  <text x="741" y="360" font-size="11" fill="#0F766E" text-anchor="middle">每 5s 播报 + 命令链路</text>

  <rect x="644" y="410" width="304" height="132" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="666" cy="448" r="5" fill="#3B82F6"/>
  <text x="682" y="453" font-size="14" font-weight="bold" fill="#0F172A">远程 · WiFi（DA16200）</text>
  <text x="666" y="480" font-size="11.5" fill="#475569">SCI2 · MQTT → broker.emqx.io</text>
  <rect x="666" y="506" width="118" height="24" rx="12" fill="#EFF6FF"/>
  <text x="725" y="522" font-size="11" fill="#1D4ED8" text-anchor="middle">每 10s 一帧</text>

  <!-- ================= 连接箭头 ================= -->
  <line x1="227" y1="322" x2="296" y2="322" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="261" y="308" font-size="11" fill="#0F766E" text-anchor="middle">感知数据</text>

  <line x1="606" y1="159" x2="644" y2="159" stroke="#64748B" stroke-width="2" marker-end="url(#arrSlate)"/>
  <line x1="606" y1="314" x2="644" y2="314" stroke="#64748B" stroke-width="2" marker-end="url(#arrSlate)"/>
  <line x1="606" y1="476" x2="644" y2="476" stroke="#64748B" stroke-width="2" marker-end="url(#arrSlate)"/>

  <!-- ================= 底部数据条 ================= -->
  <rect x="32" y="556" width="916" height="34" rx="10" fill="#F1F5F9"/>
  <text x="490" y="578" font-size="12.5" fill="#334155" text-anchor="middle">低功耗实测（整板口径）：运行 26 mA → Sleep 23 mA → 软待机 15.5 mA → 深待机 15.0 mA</text>
</svg>
